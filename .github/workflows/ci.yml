name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: abatilo/actions-poetry@v2
        with:
          poetry-version: "2.0.0"

      - name: Install dependencies
        run: poetry install

      - name: Run lint
        run: make lint

  changes:
    runs-on: ubuntu-latest
    outputs:
      subscription: ${{ steps.filter.outputs.subscription }}
      alert_engine: ${{ steps.filter.outputs.alert_engine }}
      email: ${{ steps.filter.outputs.email }}
      telegram: ${{ steps.filter.outputs.telegram }}
      ntfy: ${{ steps.filter.outputs.ntfy }}
      notifiers_common: ${{ steps.filter.outputs.notifiers_common }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect impacted suites
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python .github/scripts/impacted_suites.py

  integration:
    needs: changes
    runs-on: ubuntu-latest
    # A matrix whose every cell is skipped fails the workflow. Skip the job.
    if: needs.changes.outputs.any == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: abatilo/actions-poetry@v2
        with:
          poetry-version: "2.0.0"

      - name: Install dependencies
        run: poetry install

      - name: Prepare log volume
        run: mkdir -p logs

      - name: Subscription
        if: needs.changes.outputs.subscription == 'true' || needs.changes.outputs.shared == 'true'
        run: make integration-test-subscription

      - name: Alert engine
        if: needs.changes.outputs.alert_engine == 'true' || needs.changes.outputs.shared == 'true'
        run: make integration-test-alert-engine

      - name: Email
        if: |
          needs.changes.outputs.email == 'true' ||
          needs.changes.outputs.notifiers_common == 'true' ||
          needs.changes.outputs.shared == 'true'
        run: make integration-test-email-notifier

      - name: Telegram
        if: |
          needs.changes.outputs.telegram == 'true' ||
          needs.changes.outputs.notifiers_common == 'true' ||
          needs.changes.outputs.shared == 'true'
        run: make integration-test-telegram-notifier

      - name: ntfy
        if: |
          needs.changes.outputs.ntfy == 'true' ||
          needs.changes.outputs.notifiers_common == 'true' ||
          needs.changes.outputs.shared == 'true'
        run: make integration-test-ntfy-notifier
