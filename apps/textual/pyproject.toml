[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boomerang-textual"
version = "0.1.0"
description = "Textual UI client for Boomerang"
requires-python = ">=3.11"
dependencies = [
  "textual>=0.85.0",
  "httpx>=0.27.0"
]

[project.scripts]
boomerang-textual = "boomerang_textual.app:run"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]

