services:
  rabbitmq:
    image: rabbitmq:4.3-management
    container_name: boomerang-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      # `ping` alone can succeed before AMQP accepts connections; the registry
      # then crashes on first connect and compose --wait fails.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  mailhog:
    image: mailhog/mailhog
    container_name: boomerang-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  kontiki-registry:
    build:
      context: .
      dockerfile: Dockerfile.kontiki-registry
    container_name: boomerang-kontiki-registry
    command: >
      kontiki_registry --config /stack/common.docker.yaml --config /stack/kontiki_registry.yaml
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./stack:/stack:ro
      - ./logs:/logs
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8080/live/ServiceRegistry\", timeout=2).read()'",
        ]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 40s
