services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: boomerang-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailhog:
    image: mailhog/mailhog
    container_name: boomerang-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  kontiki-registry:
    build:
      context: .
      dockerfile: Dockerfile.kontiki-registry
    container_name: boomerang-kontiki-registry
    command: >
      kontiki_registry --config /stack/common.docker.yaml --config /stack/kontiki_registry.yaml
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./stack:/stack:ro
      - ./logs:/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import glob, os; ok=False\nfor p in glob.glob(\"/proc/[0-9]*/cmdline\"):\n    try:\n        s=open(p,\"rb\").read().decode(\"utf-8\",\"ignore\")\n    except Exception:\n        continue\n    if \"kontiki_registry\" in s:\n        ok=True\n        break\nraise SystemExit(0 if ok else 1)'"]
      interval: 5s
      timeout: 3s
      retries: 20
