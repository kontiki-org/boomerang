services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: boomerang-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailhog:
    image: mailhog/mailhog
    container_name: boomerang-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  kontiki-registry:
    build:
      context: .
      dockerfile: Dockerfile.kontiki-registry
    container_name: boomerang-kontiki-registry
    command: >
      kontiki_registry --config /stack/common.docker.yaml --config /stack/kontiki_registry.yaml
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./stack:/stack:ro
      - ./logs:/logs
    restart: unless-stopped
    # PID 1 is kontiki_registry; start_period covers AMQP connect after rabbitmq-healthy.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from pathlib import Path; raise SystemExit(0 if b'kontiki_registry' in Path('/proc/1/cmdline').read_bytes() else 1)",
        ]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 40s
