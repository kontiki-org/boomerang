services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: boomerang-rabbitmq
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  kontiki-registry:
    build:
      context: .
      dockerfile: Dockerfile.kontiki-registry
    container_name: boomerang-kontiki-registry
    command: >
      kontiki_registry --config /stack/common.docker.yaml --config /stack/kontiki_registry.yaml
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./stack:/stack:ro
      - ./logs:/logs
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8080/live/ServiceRegistry\", timeout=2).read()'",
        ]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 40s

  mailhog:
    image: mailhog/mailhog
    container_name: boomerang-mailhog
    ports:
      - "1025:1025"     # SMTP
      - "8025:8025"     # Web UI
    restart: unless-stopped

  subscription-service:
    build:
      context: .
    container_name: boomerang-subscription-service
    command: >
      boomerang-subscription
      --config /stack/common.services.yaml
      --config /stack/subscription.yaml
    depends_on:
      rabbitmq:
        condition: service_healthy
      kontiki-registry:
        condition: service_healthy
    volumes:
      - ./stack:/stack:ro
      - ./data:/data
    ports:
      - "8002:8002"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c 'import urllib.request; urllib.request.urlopen(\"http://kontiki-registry:8080/live/subscription-service\", timeout=2).read()'",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  email-notifier-service:
    build:
      context: .
    container_name: boomerang-email-notifier-service
    command: >
      boomerang-email-notifier
      --config /stack/common.services.yaml
      --config /stack/notifiers/email.yaml
    depends_on:
      rabbitmq:
        condition: service_healthy
      kontiki-registry:
        condition: service_healthy
      mailhog:
        condition: service_started
    volumes:
      - ./stack:/stack:ro
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c 'import urllib.request; urllib.request.urlopen(\"http://kontiki-registry:8080/live/email-notifier-service\", timeout=2).read()'",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  telegram-notifier-service:
    build:
      context: .
    container_name: boomerang-telegram-notifier-service
    command: >
      sh -c 'EXTRA=""; if [ -f /stack/notifiers/telegram_bot_token.yaml ]; then EXTRA="--config /stack/notifiers/telegram_bot_token.yaml"; fi;
      exec boomerang-telegram-notifier --config /stack/common.services.yaml --config /stack/notifiers/telegram.yaml $$EXTRA'
    depends_on:
      rabbitmq:
        condition: service_healthy
      kontiki-registry:
        condition: service_healthy
    volumes:
      - ./stack:/stack:ro
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c 'import urllib.request; urllib.request.urlopen(\"http://kontiki-registry:8080/live/telegram-notifier-service\", timeout=2).read()'",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  alert-engine-service:
    build:
      context: .
    container_name: boomerang-alert-engine-service
    command: >
      boomerang-alert-engine
      --config /stack/common.services.yaml
      --config /stack/alert_engine.yaml
    depends_on:
      rabbitmq:
        condition: service_healthy
      kontiki-registry:
        condition: service_healthy
      subscription-service:
        condition: service_healthy
    volumes:
      - ./stack:/stack:ro
      - ./data:/data
    ports:
      - "8005:8005"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c 'import urllib.request; urllib.request.urlopen(\"http://kontiki-registry:8080/live/alert-engine-service\", timeout=2).read()'",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
