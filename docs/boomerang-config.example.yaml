# =============================================================================
# External sentinel (email-notifier, telegram-notifier, or ntfy-notifier)
# Omit the whole sentinel block on a notifier that only delivers alerts.
# POST /watchdogs/{name}/heartbeat — Bearer token, empty body.
# A timeout sends a structured Down alert (critical); a later heartbeat sends
# Recovered (low). Banner / email subject is Down or Recovered; the name is
# the watchdog attribute. Category kontiki.sentinel.
# A sentinel outside the monitored environment also sets kontiki.amqp.disable: true.
# =============================================================================
# app:
#   sentinel:
#     state_path: /var/lib/boomerang/sentinel-state.json   # required
#     sweep_seconds: 1                                      # default 1
#     watchdogs:
#       prod:
#         token: "change-me"
#         timeout_seconds: 180   # >= 3 × the monitor send interval
#         endpoint_key: ops_alerts   # must exist in app.endpoints

