# Example Boomerang application configuration (app.*).
# Each service loads its own YAML — copy the relevant block into that service's
# config (Compose merges stack/common.services.yaml + stack/<service>.yaml).
# Framework keys (kontiki.*) are documented in Kontiki's docs/configuration.md.
# Full reference: docs/configuration.md

# =============================================================================
# subscription-service
# =============================================================================
# app:
#   subscriptions:
#     # audience (team/role) → recipient_id; not an end-user
#     ops:
#       # rule id under this audience (pause/enable independently; not sent to notifiers)
#       quakes:
#         status: active   # or paused
#         subscription:
#           rule:
#             category: natural.earthquake
#             event_type: "*"
#             # criteria:            # omit for attribute catch-all
#             #   all_of:
#             #     - key: magnitude
#             #       operator: gte  # eq | gte | lte | contains
#             #       value: 4.5
#           endpoints:
#             - telegram.ops_alerts
#             - email.inbox
#
# Optional catalogue lists (TUI / discovery only — not required for delivery):
#   alert_connectors: []       # producer service names for alert-catalog aggregation
#   notification_channels: []  # notifier service names for channels-catalog aggregation

