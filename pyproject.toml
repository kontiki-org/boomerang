[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "boomerang"
version = "0.1.0"
description = "Service built on Kontiki."
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{ include = "boomerang" }]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
kontiki = ">=1.1.0"
pydantic = "^2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.0.0"
black = "^23.0.0"
isort = "^5.12.0"
flake8 = "^7.0.0"
behave = "^1.2.6"

[tool.poetry.scripts]
boomerang-subscription = "boomerang.services.subscription.main:run"
boomerang-identity = "boomerang.services.identity.main:run"
boomerang-email-notifier = "boomerang.services.email_notifier.main:run"
boomerang-telegram-notifier = "boomerang.services.telegram_notifier.main:run"
boomerang-sms-notifier = "boomerang.services.sms_notifier.main:run"
boomerang-alert-engine = "boomerang.services.alert_engine.main:run"
boomerang-earthquake-feed = "boomerang.services.alert_services.earthquake.main:run"
boomerang-kontiki-registry-alert = "boomerang.services.alert_services.kontiki_registry.main:run"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["boomerang"]
