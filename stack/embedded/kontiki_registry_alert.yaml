# Embedded overlay for kontiki-registry-alert-service (fleet expectations + ops HTTP).
# Loaded after stack/kontiki_registry_alert.yaml by docker-compose.embedded.yaml.

kontiki:
  http:
    address: "0.0.0.0"
    port: 8091

kontiki-registry-alert-service:
  expected_services:
    demo-app-service:
      min_active: 1
    subscription-service:
      min_active: 1
    alert-engine-service:
      min_active: 1
    email-notifier-service:
      min_active: 1
    telegram-notifier-service:
      min_active: 1
