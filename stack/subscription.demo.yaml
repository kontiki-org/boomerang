# Merged on top of subscription.yaml when starting with docker-compose.demo.yaml.
app:
  alert_connectors:
    - earthquake-feed-service

  subscriptions:
    earthquakes:
      category: natural.earthquake
      event_type: earthquake
      criteria:
        - key: magnitude
          operator: gte
          value: 2
      endpoints:
        - telegram.alerts
        - email.inbox
