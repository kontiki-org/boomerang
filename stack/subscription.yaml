kontiki:
  http:
    address: "0.0.0.0"
    port: 8002

logging:
  handlers:
    file:
      filename: /data/subscription_service.log

app:
  storage:
    backend: sqlite
    sqlite_path: /data/subscriptions.db

  alert_connectors:
    - earthquake-feed-service
    - kontiki-registry-alert-service

  notification_channels:
    - email-notifier-service
    - telegram-notifier-service
