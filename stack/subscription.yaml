kontiki:
  http:
    address: "0.0.0.0"
    port: 8002

logging:
  handlers:
    file:
      filename: /data/subscription_service.log

app:
  storage:
    backend: sqlite
    sqlite_path: /data/subscriptions.db

  # Limit core stack to email channel (no SMS).
  channels:
    - email

  alert_connectors:
    - earthquake-feed-service
