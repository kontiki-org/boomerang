kontiki:
  amqp:
    url: amqp://guest:guest@localhost/

logging:
  version: 1
  disable_existing_loggers: false
  formatters:
    default:
      format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  handlers:
    console:
      class: logging.StreamHandler
      formatter: default
      level: INFO
  root:
    level: INFO
    handlers:
      - console

app:
  # Demo flag only — real connectors add domain settings here.
  demo: true
