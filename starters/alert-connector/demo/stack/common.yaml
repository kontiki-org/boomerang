kontiki:
  amqp:
    url: amqp://guest:guest@rabbitmq/
  registration:
    delay: 3

logging:
  version: 1
  disable_existing_loggers: true
  formatters:
    default:
      format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  handlers:
    file:
      class: logging.FileHandler
      formatter: default
      level: INFO
  root:
    level: INFO
    handlers:
      - file
