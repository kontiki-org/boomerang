# Autonomous demo stack for the Boomerang Alert Connector Starter Kit (S1).
# Dogfooding: builds Boomerang services from the monorepo (context ../..).
# Published images: later.
#
# kontiki-registry is platform plumbing (AMQP topology / registration), not an alert source.

name: boomerang-starter

services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: boomerang-starter-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  mailhog:
    image: mailhog/mailhog
    container_name: boomerang-starter-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  kontiki-registry:
    build:
      context: ../..
      dockerfile: Dockerfile.kontiki-registry
    container_name: boomerang-starter-kontiki-registry
    command: >
      kontiki_registry
      --config /stack/common.yaml
      --config /stack/kontiki_registry.yaml
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./demo/stack:/stack:ro
      - ./demo/data:/data
      - ./demo/logs:/logs
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import glob; raise SystemExit(0 if any('kontiki_registry' in open(p,'rb').read().decode('utf-8','ignore') for p in glob.glob('/proc/[0-9]*/cmdline')) else 1)",
        ]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  subscription-service:
    build:
      context: ../..
    container_name: boomerang-starter-subscription
    command: >
      boomerang-subscription
      --config /stack/common.yaml
      --config /stack/subscription.yaml
    depends_on:
      rabbitmq:
        condition: service_healthy
      kontiki-registry:
        condition: service_healthy
    volumes:
      - ./demo/stack:/stack:ro
      - ./demo/data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8002/api/v1/docs\", timeout=2).read(); print(\"ok\")'",
        ]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 25s

  email-notifier-service:
    build:
      context: ../..
    container_name: boomerang-starter-email-notifier
    command: >
      boomerang-email-notifier
      --config /stack/common.yaml
      --config /stack/email_notifier.yaml
    depends_on:
      rabbitmq:
        condition: service_healthy
      kontiki-registry:
        condition: service_healthy
      mailhog:
        condition: service_started
    volumes:
      - ./demo/stack:/stack:ro
      - ./demo/data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8003/api/v1/docs\", timeout=2).read(); print(\"ok\")'",
        ]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 25s

  alert-engine-service:
    build:
      context: ../..
    container_name: boomerang-starter-alert-engine
    command: >
      boomerang-alert-engine
      --config /stack/common.yaml
      --config /stack/alert_engine.yaml
    depends_on:
      rabbitmq:
        condition: service_healthy
      kontiki-registry:
        condition: service_healthy
      subscription-service:
        condition: service_healthy
      email-notifier-service:
        condition: service_healthy
    volumes:
      - ./demo/stack:/stack:ro
      - ./demo/data:/data
    restart: unless-stopped
